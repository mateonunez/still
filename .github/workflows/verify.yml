name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/
      - run: pnpm check
      - run: pnpm --filter @mateonunez/still-plugins test
      - run: pnpm check:brand
      - run: pnpm build
      - run: pnpm typecheck
      - run: node scripts/verify-site-server.mjs
  native-domain:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift test --package-path packages/SessionKit
      - run: swift test --package-path packages/StillWidgets
      - run: swift test --package-path packages/StillPluginKit
      - run: swift test --package-path packages/StillNativePlugins
      - run: swift run --package-path packages/StillPluginKit still-plugin validate examples/plugins/porcelain-rail.stillplugin
      - run: swift run --package-path packages/StillPluginKit still-plugin validate examples/plugins/local-signals.stillplugin
      - run: swift build --package-path apps/macos
      - run: swift test --package-path apps/macos
